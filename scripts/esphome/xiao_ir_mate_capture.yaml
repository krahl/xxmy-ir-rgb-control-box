# XIAO IR Mate capture helper for XXMY MY302.
#
# Merge the relevant remote_receiver/api sections into your existing XIAO IR
# Mate ESPHome configuration, or use this as a starting point. In Home
# Assistant, enable "Allow the device to perform Home Assistant actions" for
# this ESPHome device.

substitutions:
  name: xiao-ir-mate-capture
  friendly_name: XIAO IR Mate Capture

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: arduino

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: "12345678"

captive_portal:

remote_transmitter:
  id: my_transmitter
  pin: GPIO3
  carrier_duty_percent: 50%

remote_receiver:
  id: rcvr
  pin:
    number: GPIO4
    inverted: true
  idle: 65500us
  clock_resolution: "500000"
  dump:
    - raw
  on_raw:
    then:
      - homeassistant.event:
          event: esphome.xxmy_ir_code_captured
          data:
            modulation: "38000"
          data_template:
            timings: "{{ timings }}"
          variables:
            timings: |-
              std::string out = "[";
              for (size_t i = 0; i < x.size(); i++) {
                if (i > 0) out += ",";
                out += std::to_string(x[i]);
              }
              out += "]";
              return out;
